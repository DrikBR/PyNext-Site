<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link rel="icon" type="image/png" href="../imagens/logoescura.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = {darkMode: 'class',theme: {extend: {},},};</script>
</head>
<body class="font-serif">
    <section class="bg-amber-200 dark:bg-gray-800">
        <div class="flex flex-col items-center justify-center px-6 py-8 mx-auto md:h-screen lg:py-0">
            <!-- Caixa de login -->
            <div class="relative w-full max-w-md rounded-2xl shadow bg-white dark:bg-gray-700">
      
                <!-- Imagem de fundo com opacidade controlada -->
                <div class="logo absolute inset-0 bg-center bg-cover bg-no-repeat opacity-45 rounded-lg z-0 top-20" style="background-size: 95%; background-image: url(../imagens/logoclara.png);"></div>
    
                <!-- Conteúdo da caixa -->
                <div class="relative z-10 p-6 space-y-4 md:space-y-6 sm:p-8">
                    <div class="dark:bg-gray-800 p-2 rounded text-center">
                        <h1 class="text-xl font-bold leading-tight tracking-tight md:text-2xl py-2 bg-amber-200 text-black dark:bg-gray-800 dark:text-white">Cadastrar Turma Virtual</h1>
                    </div>

                    <form class="flex flex-col gap-2" action="turmasvirtuais.html">
    
                    <div>
                        <label for="nome" class="block mb-2 text-xl font-serif dark:text-white">Nome da turma:</label>
                        <input type="text" name="nome" id="nome" class="bg-gray-50 border border-gray-400 text-gray-900 rounded-lg block w-full p-2.5 dark:bg-gray-800 dark:border-gray-900 dark:placeholder-gray-400 dark:text-white" placeholder="1814" required="">
                    </div>
      
                    <h1 class="block mb-2 text-xl font-serif dark:text-white">Adicionar alunos na Turma:</h1>
                    <div class="border border-gray-400 rounded-xl flex flex-col items-start text-lg gap-2 dark:bg-gray-800 dark:text-white bg-gray-50 text-gray-900 w-full p-2.5 dark:border-gray-900 dark:placeholder-gray-400 max-h-40 overflow-y-auto">
                        <label for="aluno1" class="flex gap-1 items-center">
                            <input type="checkbox" name="aluno1" id="aluno1" value="Tiago" class="accent-yellow-400 dark:accent-gray-500 w-5 h-5 hover:cursor-pointer"> <br>
                            <span>Tiago Cruz Lopes</span>
                        </label>
                        <label for="aluno2" class="flex gap-1 items-center justify-center">
                            <input type="checkbox" name="aluno2" id="aluno2" value="Filipa" class="accent-yellow-400 dark:accent-gray-500 w-5 h-5 hover:cursor-pointer"> <br>
                            <span>Filipa Agustina Barreto</span>
                        </label>
                        <label for="aluno3" class="flex gap-1 items-center justify-center">
                            <input type="checkbox" name="aluno3" id="aluno3" value="Felipe" class="accent-yellow-400 dark:accent-gray-500 w-5 h-5 hover:cursor-pointer"> <br>
                            <span>Felipe Diogo Nunes</span>
                        </label>
                    </div>
                       
                  <div class="flex gap-6 justify-center mt-5"> <!--flex coloca os botões na mesma linha e o gap dá o espaço entre eles-->
                    <button type="button" onclick="window.location.href='login.html'" class="w-40 bg-yellow-400 dark:bg-white font-serif rounded-lg text-base px-5 py-2.5 text-center font-bold shadow-md dark:shadow-lg shadow-black dark:shadow-black hover:bg-yellow-500 dark:hover:bg-gray-300">Cancelar</button>
                    <button type="submit" class="w-40 bg-yellow-400 dark:bg-white font-serif rounded-lg text-base px-5 py-2.5 text-center font-bold shadow-md dark:shadow-lg shadow-black dark:shadow-black hover:bg-yellow-500 dark:hover:bg-gray-300">Cadastrar</button>
                  </div>
              </form>
          </div>
      </div>
  </div>
</section>

<button id="trocar" class="fixed bottom-4 left-4 font-bold text-white dark:text-black bg-gray-800 dark:bg-amber-200 px-4 py-2 rounded-lg flex items-center gap-2 hover:cursor-pointer shadow-md shadow-black dark:shadow-amber-200 dark:hover:bg-amber-300 hover:bg-gray-900">
    <img id="icone" src="../imagens/lua.png" alt="" class="h-6 w-6">
    <span id="texto">Modo Escuro</span>
</button>

</body>
</html>
<script src="../scripts/trocar_modo.js"></script>
